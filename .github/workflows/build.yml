name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener el código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev build-essential ccache

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Limpiar variables de entorno conflictivas y Compilar
      run: |
        # Desvincular NDK global de la VM para obligar el uso de NDK r25b
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        
        # Aceptar licencias
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # Executar compilación de Buildozer
        buildozer -v android debug

    - name: Guardar el APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: app-android
        path: bin/*.apk
