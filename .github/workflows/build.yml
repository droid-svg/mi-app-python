name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener el código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev build-essential

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Prepara SDK y Licencias para Buildozer
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d "$SDK_DIR/cmdline-tools"
        mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
        rm cmdline.zip

        # Resuelve la ruta 'tools/bin/sdkmanager' requerida por Buildozer
        mkdir -p "$SDK_DIR/tools/bin"
        ln -s "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

        # Acepta licencias e instala la versión estable 33
        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Guardar el APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: app-android
        path: bin/*.apk
