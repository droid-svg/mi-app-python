name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener el código fuente
      uses: actions/checkout@v4

    - name: Compilar APK con la Action Oficial de Kivy
      uses: kivy/buildozer-action@v1.22
      with:
        command: buildozer -v android debug
        buildozer_version: stable

    - name: Guardar el APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: app-android
        path: bin/*.apk
