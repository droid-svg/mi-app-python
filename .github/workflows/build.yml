name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener el código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev build-essential

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Aceptar licencias en la ruta de Buildozer
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24333f8a637188ea803802c9107f2d622f962396\n893308227417500da60340b0805c93a0273a0e69\nd56f518747703090020788633e076b6a6d273ba2" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" || true

    - name: Compilar APK con Buildozer
      run: |
        buildozer --accept-sdk-license -v android debug

    - name: Guardar el APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: app-android
        path: bin/*.apk
